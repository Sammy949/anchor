version: "1"
kind: miner
id: 49
slug: anchor
protocol: generic
name: Anchor
description: >
  On-chain counterparty-risk miner. Given a wallet, returns an ALLOW / RECHECK / BLOCK verdict on whether it is financially safe for an agent to extend credit to or transact with it, derived from live Aave v3 lending-protocol solvency state on Base, with a plain-language reason and block-pinned freshness metadata.

base_url: https://anchor-miner.vercel.app

docs:
  documentation: https://github.com/Sammy949/anchor/blob/main/README.md
  repository: https://github.com/Sammy949/anchor
  twitter: https://x.com/I_am_SamY01

limitations:
  - code: SINGLE_PROTOCOL
    message: >
      Assesses on-chain solvency risk from Aave v3 on Base mainnet only. The verdict reflects lending-position risk (leverage, liquidation proximity), not scam or drainer detection. Liquidation distance assumes a uniform price drop across the collateral basket rather than modeling per-asset volatility independently.

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 12

endpoints:
  - path: /risk-check
    external_path: /api/risk-check
    method: GET

input_schema:
  type: object
  properties:
    wallet:
        type: string
        description: Ethereum wallet address to assess for on-chain counterparty risk (Aave v3 position on Base mainnet). Provide this for a specific-wallet solvency check; omit it for a general fraud-knowledge question (use `query` instead).
    query:
        type: string
        description: A natural-language fraud/risk question, answered when no specific wallet is being assessed (e.g. "What characterized the BitConnect Ponzi scheme?" or "Who was behind OneCoin?"). At least one of `wallet` or `query` must be present; if a wallet address appears anywhere in the query text it is treated as a wallet check.

output_schema:
  type: object
  properties:
    wallet:
        type: [string, "null"]
        description: Wallet address the risk assessment applies to; null for a knowledge-only answer (no specific wallet assessed).
    protocol:
        type: [string, "null"]
        description: Lending protocol the position was read from (e.g. aave-v3); null for a knowledge-only answer.
    verdict:
        type: string
        enum: [ALLOW, RECHECK, BLOCK, INFO]
        description: "Counterparty-risk verdict an agent can act on: ALLOW, RECHECK, or BLOCK for a wallet check; INFO for a fraud-knowledge answer."
    reasoning:
        type: string
        description: Plain-language explanation — the specific solvency defect and recommended next step for a wallet check, or the factual answer for a fraud-knowledge question.
    signals:
        type: [object, "null"]
        description: "Underlying evidence the verdict is derived from: risk label, health factor, liquidation distance, collateral, debt, and liquidation threshold. Null for a knowledge-only answer."
    confidence:
        type: number
        description: >
                Confidence score (0–1). For a wallet check it reflects freshness of the read and decays as block age increases; for a knowledge answer it is a fixed reasonable value.
    meta:
        type: object
        description: "Metadata. Wallet check: block number, timestamp, source, chain ID, and network. Knowledge answer: timestamp, source, and the model that produced the answer."
  required:
    - verdict
    - reasoning
    - confidence
    - meta

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: verdict
    reason_field: reasoning
  supported_intents:
    - FRAUD_DETECTION

